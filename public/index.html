<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손프라</title>
  <meta name="description" content="둘 곳 없어도 괜찮아요. 웹에서 프라모델을 조립하고, 데스크톱에 진열하세요." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect y='6' width='64' height='58' rx='16' fill='%23C92F2F'/%3E%3Crect width='64' height='58' rx='16' fill='%23FF4A4A'/%3E%3Ctext x='32' y='41' font-size='30' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif'%3E%EC%86%90%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body class="is-home">
  <main id="home" class="home">
    <h1 class="brand">
      <span class="logo-mark" aria-hidden="true">손</span>
      <span class="wordmark"><span>손</span><span>프</span><span>라</span></span>
    </h1>
    <p class="tagline">둘 곳 없어도 괜찮아요. 웹에서 조립하고, 데스크톱에 진열하세요.</p>
    <button type="button" id="start" class="btn btn-primary l">설계 상담 시작하기</button>

    <section class="kits" aria-labelledby="kits-title">
      <h2 id="kits-title">이런 의뢰가 많아요</h2>
      <div id="kit-grid" class="kit-grid"></div>
    </section>
  </main>

  <section id="consult" class="consult" hidden>
    <div class="counter">
      <div class="counter-head">
        <button type="button" id="home-btn" class="mini-brand" aria-label="처음 화면으로">
          <span class="logo-mark s" aria-hidden="true">손</span>
          <span class="wordmark s"><span>손</span><span>프</span><span>라</span></span>
        </button>
        <div class="tone" role="radiogroup" aria-label="말투">
          <button type="button" data-tone="mild" role="radio" aria-checked="true">🍼 순한맛</button>
          <button type="button" data-tone="spicy" role="radio" aria-checked="false">🌶️ 매운맛</button>
        </div>
      </div>

      <div id="chat" class="chat" aria-live="polite"></div>

      <div class="composer-wrap">
        <div id="preview" class="preview" hidden>
          <img alt="첨부 이미지 미리보기" />
          <span class="meta"></span>
          <button type="button" class="x" aria-label="첨부 취소">✕</button>
        </div>
        <form id="composer" class="composer">
          <label class="attach" title="사진·디자인 올리기" tabindex="0">
            <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
            <span aria-hidden="true">📷</span><span class="sr">사진 올리기</span>
          </label>
          <textarea id="text" rows="1" placeholder="손프라에게 편하게 말씀해 주세요"></textarea>
          <button id="send" type="submit" class="btn btn-primary send">보내기</button>
        </form>
        <p id="hint" class="hint"></p>
      </div>
    </div>
  </section>

  <footer class="foot"><span id="mode"></span></footer>

  <dialog id="handoff" class="handoff">
    <header>
      <div>
        <small>조립 마이크로서비스로 넘길 설계 데이터</small>
        <h2 id="h-title"></h2>
      </div>
      <button type="button" class="x" data-close aria-label="닫기">✕</button>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="glance" class="on">한눈에 보기</button>
      <button type="button" role="tab" data-tab="parts">파츠 표</button>
      <button type="button" role="tab" data-tab="json">JSON</button>
    </nav>
    <section data-pane="glance" class="pane glance"></section>
    <section data-pane="parts" class="pane parts" hidden></section>
    <section data-pane="json" class="pane json" hidden><pre><code></code></pre></section>
    <footer>
      <span id="h-valid"></span>
      <div>
        <button type="button" id="h-copy" class="btn btn-secondary s">JSON 복사</button>
        <button type="button" id="h-download" class="btn btn-primary s">JSON 다운로드</button>
      </div>
    </footer>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
