<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runner Lab 설계 검수소</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">A1</span>
      <div>
        <strong>Runner Lab</strong>
        <small>프라모델 설계 검수소</small>
      </div>
      <span id="mode" class="mode">…</span>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="말투">
        <button type="button" data-tone="mild" class="on" role="radio" aria-checked="true">🍼 순한맛</button>
        <button type="button" data-tone="spicy" role="radio" aria-checked="false">🌶️ 매운맛</button>
      </div>
      <label class="grade">
        <span>등급</span>
        <select id="grade">
          <option value="auto">자동 추천</option>
          <option value="SD">SD</option>
          <option value="HG">HG</option>
          <option value="MG">MG</option>
        </select>
      </label>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <footer class="composer-wrap">
    <div id="samples" class="samples">
      <span>샘플로 테스트:</span>
      <button type="button" data-sample="cat">🐱 고양이 정면</button>
      <button type="button" data-sample="oc">🧑‍🎤 캐릭터 정면+측면</button>
      <button type="button" data-sample="blur">🐶 흐리고 잘린 사진</button>
    </div>
    <div id="preview" class="preview" hidden>
      <img alt="첨부 이미지 미리보기" />
      <span class="meta"></span>
      <button type="button" class="x" aria-label="첨부 취소">✕</button>
    </div>
    <form id="composer" class="composer">
      <label class="attach" title="사진·단면도 첨부" tabindex="0">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        <span aria-hidden="true">📎</span><span class="sr">사진 첨부</span>
      </label>
      <textarea id="text" rows="1" placeholder="사진을 올리고 한 줄 설명을 적어 주세요 (예: 우리집 고양이 정면, 꼬리까지 다 나옴)"></textarea>
      <button id="send" type="submit" class="send">검수 요청</button>
    </form>
    <p id="hint" class="hint"></p>
  </footer>

  <dialog id="handoff" class="handoff">
    <header>
      <div>
        <small>3D 조립 마이크로서비스 전달 데이터</small>
        <h2 id="h-title"></h2>
      </div>
      <button type="button" class="x" data-close aria-label="닫기">✕</button>
    </header>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="sheet" class="on">런너 도면</button>
      <button type="button" role="tab" data-tab="parts">파츠 표</button>
      <button type="button" role="tab" data-tab="json">JSON</button>
    </nav>
    <section data-pane="sheet" class="pane sheet"></section>
    <section data-pane="parts" class="pane parts" hidden></section>
    <section data-pane="json" class="pane json" hidden><pre><code></code></pre></section>
    <footer>
      <span id="h-valid"></span>
      <div>
        <button type="button" id="h-copy">JSON 복사</button>
        <button type="button" id="h-download" class="primary">JSON 다운로드</button>
      </div>
    </footer>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
